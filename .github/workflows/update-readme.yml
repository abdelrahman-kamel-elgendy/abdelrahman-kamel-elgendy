name: Update README Daily

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-readme
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Update tip and quote in README
        run: python3 scripts/update_readme.py

      - name: Commit and push
        env:
          GIT_NAME: abdelrahman-kamel-elgendy
          GIT_EMAIL: abdelrahman.kamel.elgendy@gmail.com
        run: |
          git config user.name  "$GIT_NAME"
          git config user.email "$GIT_EMAIL"
          git add README.md
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Update daily tip and quote $(TZ=Africa/Cairo date +'%Y-%m-%d')"
          git pull --rebase --autostash
          git push
