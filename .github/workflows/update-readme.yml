name: Update README Daily

on:
  schedule:
    - cron: "0 0 * * *"   # 00:00 UTC (02:00/03:00 Cairo)
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: update-readme
  cancel-in-progress: false

env:
  BASE_BRANCH: main
  UPDATE_BRANCH: dev

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ env.BASE_BRANCH }}

      - name: Update tip and quote in README
        run: python3 scripts/update_readme.py

      - name: Commit and push to update branch
        id: commit
        env:
          GIT_NAME: abdelrahman-kamel-elgendy
          GIT_EMAIL: abdelrahman.kamel.elgendy@gmail.com
        run: |
          git config user.name  "$GIT_NAME"
          git config user.email "$GIT_EMAIL"

          # Always branch from the latest main
          git switch -C "$UPDATE_BRANCH"
          git add README.md

          if git diff --cached --quiet; then
            echo "No changes to commit."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git commit -m "Update daily tip and quote $(TZ=Africa/Cairo date +'%Y-%m-%d')"
          git push --force origin "$UPDATE_BRANCH"
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Open pull request (if none is open)
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          existing=$(gh pr list --head "$UPDATE_BRANCH" --base "$BASE_BRANCH" \
                       --state open --json number --jq '.[0].number')
          if [ -z "$existing" ]; then
            gh pr create \
              --base "$BASE_BRANCH" \
              --head "$UPDATE_BRANCH" \
              --title "Update daily tip and quote $(TZ=Africa/Cairo date +'%Y-%m-%d')" \
              --body "Automated daily README update."
          else
            echo "PR #$existing already open, branch updated."
          fi

      - name: Approve pull request
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.PR_APPROVER_TOKEN }}   # your PAT, NOT github.token
          GH_REPO: ${{ github.repository }}
        run: gh pr review "$UPDATE_BRANCH" --approve --body "Auto-approved: daily README update."